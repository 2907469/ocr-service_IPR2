name: CI/CD

# Любой push в main или ipr22 запускает проверки и автоматический деплой.
# Pull request в main — только проверки (без деплоя).
on:
  push:
    branches: [main, ipr22]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Jest
        run: npm test

  frontend-ci:
    name: Frontend — build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://example.invalid

  deploy-backend:
    name: Deploy backend (Render)
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          DEPLOY_ID=$(curl -fsS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" | jq -r '.id')
          echo "Deploy id: $DEPLOY_ID"
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait until deploy is live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) echo "Deploy failed: $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timeout waiting for deploy"; exit 1

      - name: Smoke test /health
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 30 "$BACKEND_URL/health"; then echo; exit 0; fi
            echo "retry $i"; sleep 10
          done
          exit 1

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  notify:
    name: Telegram notification
    needs: [backend-ci, frontend-ci, deploy-backend, deploy-frontend]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Send status to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKEND_CI: ${{ needs.backend-ci.result }}
          FRONTEND_CI: ${{ needs.frontend-ci.result }}
          DEPLOY_BACKEND: ${{ needs.deploy-backend.result }}
          DEPLOY_FRONTEND: ${{ needs.deploy-frontend.result }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Telegram secrets not set"; exit 0; fi
          if echo "$BACKEND_CI $FRONTEND_CI $DEPLOY_BACKEND $DEPLOY_FRONTEND" | grep -Eq "failure|cancelled"; then
            HEAD="❌ Сборка/деплой ПРОВАЛЕНЫ"
          else
            HEAD="✅ Сборка и деплой прошли успешно"
          fi
          MSG="$HEAD
          Репозиторий: $REPO
          Ветка: $BRANCH
          Коммит: ${SHA:0:7} (by $ACTOR)
          Backend CI: $BACKEND_CI
          Frontend CI: $FRONTEND_CI
          Deploy backend: $DEPLOY_BACKEND
          Deploy frontend: $DEPLOY_FRONTEND
          $RUN_URL"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
